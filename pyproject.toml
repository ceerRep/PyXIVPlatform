[project]
name = "pyxivplatform"
version = "0.1.0"
description = "A simple FFXIV scripting platform"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "openai",
    # Embedded PostNamazu mode loads the bundled PostNamazu.dll via .NET CLR.
    # Required on Windows; harmless to install on other platforms but unused.
    "pythonnet>=3.0; sys_platform == 'win32'",
    "capstone>=5.0",
]

[tool.uv]
package = false
